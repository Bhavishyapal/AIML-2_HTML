<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <fieldset>
      <legend>BioData</legend>
      <form action="./response.html">
        <label for="name"> UserName:</label>
        <input
          type="text"
          name="name"
          id="name"
          placeholder="Enter your Name"
        />
        <br><br>
        <label for="pass">password:</label>
        <input type="password" name="pass" id="pass">
        <br><br>
        <label for="dob">DOB:</label>
        <input type="date" name="dob" id="dob">
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="gender">
        <label for="gender">Male</label>
        <input type="radio" name="gender" id="gender">
        <label for="gender">Female</label>
        <br><br>
        <label for="lang">select Language:</label>
        <select name="lang" id="lang">
          <option value="select">Select</option>
          <option value="C">C</option>
          <option value="C++">C++</option>
          <option value="Java">Java</option>
          <option value="Python">Python</option>
        </select>
        <br><br>
        <label for="hobby">Hobbies:</label>
        <input type="checkbox" name="hobby1" id="hobby">
        <label for="hobby">Cricket</label>
        <input type="checkbox" name="hobby2" id="hobby">
        <label for="hobby">Football</label>
        <br><br>
        <label for="add">Address:</label>
        <textarea name="add" id="add"></textarea>
        <br><br>
        <label for="tel">Phone:</label>
        <input type="tel" name="tel" id="tel">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email">
        <br><br>
        <label for="att">Attempt:</label>
        <input type="number" name="att" id="att">
        <br><br>
        <label for="url">Homepage:</label>
        <input type="url" name="url" id="url">
        <br><br>
        <label for="file">Resume upload:</label>
        <input type="file" name="file" id="file">
        <br><br>
        <input type="submit" value="Book Now">
        <input type="reset" value="Reset Form">
        <br><br>


      </form>
    </fieldset>
  </body>
</html>
